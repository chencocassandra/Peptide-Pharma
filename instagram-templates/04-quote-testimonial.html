<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Peptide Pharma · Sample quote (fictional)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shared.css" />
    <style>
      .body { padding: 48px 72px 0; flex: 1; display: flex; flex-direction: column; }
      .banner { background: #8a3a32; color: #fff; padding: 12px 16px; font-size: 16px; letter-spacing: 0.08em; text-transform: uppercase; text-align: center; }
      .mark { font-family: "Space Grotesk", Inter, sans-serif; font-size: 140px; line-height: 0.7; color: var(--accent); }
      blockquote { margin-top: 8px; font-size: 36px; line-height: 1.25; font-weight: 600; letter-spacing: -0.03em; }
      .stars { margin-top: 28px; font-size: 28px; letter-spacing: 8px; color: var(--accent); }
      .attr { margin-top: 20px; font-size: 20px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted-fg); }
      .sku { margin-top: 12px; font-size: 16px; color: var(--muted-fg); }
    </style>
  </head>
  <body>
    <div class="page">
      <p class="hint">Fictional sample copy for layout only · <span data-sku-hint></span></p>
      <article class="canvas">
        <div class="inner">
          <p class="banner">Fictional sample — not a real customer. Do not post as a genuine review.</p>
          <div class="body">
            <div class="logo">
              <img src="logo.svg" width="64" height="64" alt="" />
              <span>Peptide Pharma</span>
            </div>
            <p class="mark" aria-hidden="true">“</p>
            <blockquote class="display" data-fill="quote"></blockquote>
            <p class="stars" data-fill="stars"></p>
            <p class="attr" data-fill="attribution"></p>
            <p class="sku" data-fill="title"></p>
          </div>
          <footer class="footer">
            <p class="fine">Research use only. Sample copy is about packing and paperwork, not health outcomes.</p>
          </footer>
        </div>
      </article>
    </div>
    <script src="catalog.js"></script>
    <script src="fill.js"></script>
  </body>
</html>
