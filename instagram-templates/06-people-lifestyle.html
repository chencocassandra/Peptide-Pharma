<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Peptide Pharma · Photo frame</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shared.css" />
    <style>
      .canvas { background: var(--ink); }
      .bar { display: flex; align-items: center; padding: 28px 48px; background: var(--primary); color: var(--primary-fg); }
      .bar .logo span { color: var(--primary-fg); }
      .photo { flex: 1; }
      .caption { padding: 36px 48px 48px; background: var(--bg); }
      .caption h1 { font-size: 40px; }
    </style>
  </head>
  <body>
    <div class="page">
      <p class="hint">Drop a real photo into the striped box. No stock or AI people.</p>
      <article class="canvas">
        <div class="inner">
          <div class="bar">
            <div class="logo">
              <img src="logo.svg" width="64" height="64" alt="" />
              <span>Peptide Pharma</span>
            </div>
          </div>
          <div class="placeholder-photo photo swap" title="SWAP: real photograph only">REAL PHOTO GOES HERE</div>
          <div class="caption">
            <p class="eyebrow">Caption space</p>
            <h1 class="display swap" title="SWAP: caption">PLACEHOLDER caption — lab, packing, or vial-in-hand. No treatment claims.</h1>
            <p class="fine" style="margin-top: 12px">For laboratory research use only. Not for human or veterinary consumption.</p>
          </div>
        </div>
      </article>
    </div>
  </body>
</html>
