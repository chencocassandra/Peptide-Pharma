<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Peptide Pharma · Product spotlight</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="shared.css" />
    <link rel="stylesheet" href="layouts.css" />
  </head>
  <body>
    <div class="page">
      <p class="hint">Carousel 01 · Spotlight · 1080×1350 · <span data-sku-hint></span></p>
      <article class="canvas canvas-split">
        <div class="inner">
          <div class="split">
            <div class="split-copy">
              <div class="logo">
                <img src="logo.svg" width="96" height="96" alt="" />
                <span>Peptide<br />Pharma</span>
              </div>
              <p class="eyebrow split-kicker" data-fill="category"></p>
              <h1 class="display" data-fill="title"></h1>
              <p class="split-price" data-fill="price"></p>
              <p class="split-body" data-fill="body"></p>
              <span class="chip">Research use only</span>
            </div>
            <figure class="split-photo">
              <p class="chip chip-light split-url">www.peptidepharma.com</p>
              <img data-src="image" alt="" />
              <div class="reagent-solo">
                <p>Peptide<br />Pharma</p>
                <p data-fill="sku"></p>
                <p>Research use only</p>
              </div>
            </figure>
          </div>
          <p class="legal-bar">For research use only · Not for human or veterinary consumption</p>
        </div>
      </article>
    </div>
    <script src="catalog.js"></script>
    <script src="fill.js"></script>
  </body>
</html>
